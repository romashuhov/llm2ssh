# /etc/llm2ssh/deploy.d/csbro.conf — deploy target for the `deploy` profile.
# root:root 0644. PARSED by llm2ssh-deploy, never sourced. One directive per line.
run-as        roma_shuhov
dir           /home/roma_shuhov/csbro
update-script update.sh
env-file      .env
timeout       3600
# bun lives in the owner's home; update.sh -> restart.sh -> prod.sh runs `bun install`.
path-prepend  /home/roma_shuhov/.bun/bin

# update runs repository code after `git pull` — owner Allow with the commit range.
confirm       update compose

# sudo /usr/local/lib/llm2ssh/bin/llm2ssh-deploy restart-policy csbro <container> <no|always|unless-stopped|on-failure[:N]>
container     csbro-tech csbro-pg csbro-telegram-bot csbro-api csbro-web csbro-orchestrator
container     csbro-scan-registry csbro-scan-scheduler csbro-master-maps-scheduler
container     csbro-scan-results csbro-server-full-history-worker

# .env — env-show masks EVERY value except these names.
env-public    CSBRO_CONTOUR FRONTEND_URL BETTER_AUTH_URL ORCHESTRATOR_POLL_MS ORCHESTRATOR_MAX_PARALLEL
env-public    SCAN_SCHEDULER_INTERVAL_MS SCAN_BATCH_LIMIT ACTIVE_SCAN_INTERVAL_SEC SCAN_RESULTS_WORKERS
# .env — the ONLY names the agent may propose to change (owner Allow each time).
env-edit      ORCHESTRATOR_POLL_MS ORCHESTRATOR_MAX_PARALLEL SCAN_SCHEDULER_INTERVAL_MS SCAN_BATCH_LIMIT
env-edit      ACTIVE_SCAN_INTERVAL_SEC SCAN_RESULTS_WORKERS
