# /etc/llm2ssh/deploy.d/csbro.conf — deploy target for the `deploy` profile.
# root:root 0644. PARSED by llm2ssh-deploy, never sourced. One directive per line.
run-as        roma_shuhov
dir           /home/roma_shuhov/csbro
update-script update.sh
env-file      .env
timeout       3600

# sudo llm2ssh-deploy restart-policy csbro <container> <no|always|unless-stopped|on-failure[:N]>
container     csbro-tech csbro-pg csbro-telegram-bot csbro-api csbro-web csbro-orchestrator
container     csbro-scan-registry csbro-scan-scheduler csbro-master-maps-scheduler
container     csbro-scan-results csbro-server-full-history-worker

env-edit      *
env-secret    RABBITMQ_LOGIN
