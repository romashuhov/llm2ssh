# /etc/llm2ssh/deploy.d/pratimo.conf — deploy target for the `deploy` profile.
# root:root 0644. PARSED by llm2ssh-deploy, never sourced. One directive per line.
run-as        roma_shuhov
dir           /home/roma_shuhov/pratimo
update-script update.sh
env-file      .env
# How long one action may run (seconds) before it is killed.
timeout       3600
# Tools installed in the owner's home (bun). Must be root- or owner-owned and closed to the agent.
path-prepend  /home/roma_shuhov/.bun/bin

# update/compose run whatever the repository holds after the pull — possibly code
# the agent pushed itself — so each one waits for the owner's Allow in Telegram,
# and the card shows the commit range (HEAD..origin/main) / the HEAD being built.
confirm       update compose

# sudo /usr/local/lib/llm2ssh/bin/llm2ssh-deploy compose pratimo deploy-agent
#   = docker compose --env-file .env -f docker/compose.deploy-agent.yml up -d --build --force-recreate
compose       deploy-agent docker/compose.deploy-agent.yml
# Same values prod.sh computes: owner of the repo dir + group of the docker socket.
compose-env   PRATIMO_AGENT_UID %DIR_UID%
compose-env   PRATIMO_AGENT_GID %DIR_GID%
compose-env   PRATIMO_DOCKER_GID %DOCKER_GID%

# sudo /usr/local/lib/llm2ssh/bin/llm2ssh-deploy query pratimo deploy-state   (session forced read-only)
query         deploy-state pratimo-postgres pratimo pratimo SELECT current_sha, current_at, current_subject, remote_sha, behind, dirty, dirty_files, branch, fetched_at, agent_note, checked_at FROM deploy_state WHERE id = 1

# .env — env-show masks EVERY value except the names below.
env-public    NODE_ENV LOG_LEVEL API_PUBLIC_URL WEB_PUBLIC_URL LLM_PROVIDER LLM_API_BASE LLM_MODEL
env-public    LLM_EMBEDDING_MODEL LLM_EMBEDDING_DIM LLM_DAILY_BUDGET_USD TELEGRAM_BOT_USERNAME TELEGRAM_CHANNEL_ID
env-public    PRATIMO_TRANSLATE_LANGS PRATIMO_ANN_MERGE_MAX_DIST PRATIMO_ANN_RELATED_MAX_DIST PRATIMO_PUBLISH_DEDUP_MAX_DIST
# .env — the ONLY names the agent may propose to change (each change: owner Allow,
# backup first; value = one token of A-Z a-z 0-9 _ . , : / @ + = % -).
env-edit      LOG_LEVEL LLM_MODEL LLM_DAILY_BUDGET_USD PRATIMO_TRANSLATE_LANGS
env-edit      PRATIMO_ANN_MERGE_MAX_DIST PRATIMO_ANN_RELATED_MAX_DIST PRATIMO_PUBLISH_DEDUP_MAX_DIST
